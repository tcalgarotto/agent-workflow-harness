name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: awh check examples/minimal
      - run: python -m build
      - name: Validate installed wheel outside the source tree
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          awh check "$GITHUB_WORKSPACE/examples/minimal"
  coordinator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: awh
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: awh_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awh -d awh_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AWH_TEST_DATABASE_URL: postgresql://awh:disposable-ci-only@127.0.0.1:5432/awh_test_ci
      AWH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,coordinator,coordinator-test]'
      - run: python -m unittest discover -s tests -v
      - run: awh check examples/minimal
      - run: python -m build
      - name: Verify installed coordinator and SQL migration outside source tree
        run: |
          python -m pip install --force-reinstall 'agent-workflow-harness[coordinator,coordinator-test] @ file:'"$GITHUB_WORKSPACE"/dist/agent_workflow_harness-0.1.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          AWH_DATABASE_URL="$AWH_TEST_DATABASE_URL" awh-coordinator migrate
          awh check "$GITHUB_WORKSPACE/examples/minimal"
