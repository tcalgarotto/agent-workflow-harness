[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-harness"
version = "0.1.0"
description = "Portable contracts and preflight validation for governed AI development workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Agent Workflow Harness contributors"}]
dependencies = ["jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["build>=1,<2"]

[project.urls]
Homepage = "https://github.com/tcalgarotto/agent-workflow-harness"
Issues = "https://github.com/tcalgarotto/agent-workflow-harness/issues"

[project.scripts]
awh = "agent_workflow_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workflow_harness = ["schemas/*.json"]
